{% extends 'base.html' %}
{% block navbar %}{% endblock navbar %}
{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center items-center px-4">
    <div class="glass border border-white/10 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h2 class="text-white text-2xl font-semibold mb-2">Reset Security Key</h2>
        <p class="text-gray-400 text-sm mb-8">Enter your work email to receive a recovery link.</p>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="text-red-500 text-xs bg-red-500/10 p-3 rounded-lg border border-red-500/20">
                    {{ form.email.errors }}
                </div>
            {% endif %}

            <div>
                <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2">Email Address</label>
                <input type="email" name="email" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-600 focus:outline-none focus:border-innocoda-teal focus:ring-1 focus:ring-innocoda-teal transition duration-300"
                    placeholder="name@company.com">
            </div>

            <button type="submit" 
                class="w-full bg-innocoda-teal text-innocoda-navy font-black py-4 rounded-xl shadow-lg hover:bg-white transition-all duration-300">
                SEND RECOVERY LINK
            </button>
        </form>
        
        {% comment %} <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2">Email Address</label>
                <input type="email" name="email" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-600 focus:outline-none focus:border-innocoda-teal focus:ring-1 focus:ring-innocoda-teal transition duration-300"
                    placeholder="name@company.com">
            </div>

            <button type="submit" 
                class="w-full bg-innocoda-teal text-innocoda-navy font-black py-4 rounded-xl shadow-lg hover:bg-white transition-all duration-300">
                SEND RECOVERY LINK
            </button>
        </form> {% endcomment %}
    </div>
</div>
{% endblock %}
