{% extends 'base.html' %}

{% block title %}Register Company | CodaSite{% endblock %}

{% block content %}
<div class="min-h-[90vh] flex flex-col justify-center items-center px-4 py-12">
    
    <div class="mb-8 text-center">
        <h1 class="text-white text-3xl font-black tracking-tighter uppercase">Register <span class="text-innocoda-teal">Company</span></h1>
        <p class="text-gray-500 text-xs tracking-[0.2em] mt-2 font-semibold">Step 01: Establish Organization</p>
    </div>

    <div class="glass border border-white/10 p-8 rounded-2xl shadow-2xl w-full max-w-2xl">
        <form method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {% csrf_token %}
            
            <div class="md:col-span-2">
                <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2">Legal Company Name</label>
                <input type="text" name="company_name" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-innocoda-teal outline-none transition"
                    placeholder="e.g. Aylum Limited">
            </div>

            <div>
                <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2">Project Manager Name</label>
                <input type="text" name="full_name" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-innocoda-teal outline-none transition">
            </div>

            <div>
                <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2">Work Email</label>
                <input type="email" name="email" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-innocoda-teal outline-none transition">
            </div>

            <div class="md:col-span-2">
                <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2">Administrative Password</label>
                <input type="password" name="password" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-innocoda-teal outline-none transition"
                    placeholder="Minimum 8 characters">
            </div>

            <button type="submit" 
                class="md:col-span-2 bg-innocoda-teal text-innocoda-navy font-black py-4 rounded-xl shadow-lg hover:bg-white transition-all duration-300">
                PROVISION SYSTEM ACCESS
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="{% url 'login' %}" class="text-sm text-gray-400 hover:text-white transition-colors">
                Existing account? <span class="text-innocoda-teal font-bold hover:underline">Log in here</span>
            </a>
        </div>
    </div>
</div>


{% endblock %}
