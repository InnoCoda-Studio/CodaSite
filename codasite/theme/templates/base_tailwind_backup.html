{% load static tailwind_tags %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InnoCoda Studio{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                innocoda: {
                  navy: '#001F3F',     
                  teal: '#00D2D2',     
                  slate: '#F8FAFC',    
                }
              },
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
              }
            }
          }
        }
    </script>

    <style>
        /* Smooth fade-in for pages */
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-innocoda-navy font-sans text-innocoda-slate min-h-screen">

    <main class="fade-in">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
