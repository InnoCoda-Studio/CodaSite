{% extends 'base.html' %}

{% block title %}Login | CodaSite Management{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center items-center px-4">
    
    <div class="mb-10 text-center animate-fade-in">
        <div class="inline-block p-3 rounded-2xl bg-white/5 border border-white/10 mb-4 shadow-xl">
            <img src="/static/images/innocoda_logo.png" alt="InnoCoda Logo" class="w-16 h-16">
        </div>
        <h1 class="text-white text-4xl font-black tracking-tighter">Coda<span class="text-innocoda-teal">Site</span></h1>
        <p class="text-gray-400 text-xs uppercase tracking-[0.3em] mt-2">Precision Logistics</p>
    </div>

    <div class="glass border border-white/10 p-8 rounded-2xl shadow-2xl w-full max-w-md relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-innocoda-teal/10 rounded-full blur-3xl"></div>
        
        <h2 class="text-white text-2xl font-semibold mb-8">Sign In</h2>
        
        <form method="POST" class="space-y-6 relative z-10">
            {% csrf_token %}
            
            <div>
                <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2">Identifier</label>
                <input type="text" name="username" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-600 focus:outline-none focus:border-innocoda-teal focus:ring-1 focus:ring-innocoda-teal transition duration-300"
                    placeholder="Username or Email">
            </div>

            <div>
                <div class="flex justify-between mb-2">
                    <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest">Security Key</label>
                    <a href="{% url 'password_reset' %}" class="text-[10px] text-innocoda-teal hover:underline uppercase tracking-widest">Forgot?</a>
                </div>
                <input type="password" name="password" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-600 focus:outline-none focus:border-innocoda-teal focus:ring-1 focus:ring-innocoda-teal transition duration-300"
                    placeholder="••••••••">
            </div>

            <button type="submit" 
                class="w-full bg-innocoda-teal text-innocoda-navy font-black py-4 rounded-xl shadow-lg shadow-innocoda-teal/20 hover:bg-white hover:shadow-white/10 transition-all duration-300 active:scale-95">
                INITIALIZE SESSION
            </button>
        </form>

        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/5"></div></div>
            <div class="relative flex justify-center text-[10px] uppercase tracking-widest"><span class="bg-innocoda-navy px-4 text-gray-600">New Site?</span></div>
        </div>

        <div class="text-center">
            <a href="{% url 'register' %}" class="group text-sm text-gray-400 hover:text-white transition-colors">
                Don't have a profile? <span class="text-innocoda-teal font-bold group-hover:underline">Register Company</span>
            </a>
        </div>
    </div>

    <div class="mt-8 mb-2 flex items-center gap-2 text-gray-600">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        <span class="text-[10px] uppercase tracking-[0.2em]">End-to-End Encrypted Site Logs</span>
    </div>
</div>
{% endblock %}
