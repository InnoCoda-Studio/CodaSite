{% extends 'base.html' %}

{% block title %}Register Company | CodaSite{% endblock %}

{% block content %}
<div class="min-h-[90vh] flex flex-col justify-center items-center px-4 py-12">
    
    <div class="mb-8 text-center">
        <h1 class="text-white text-3xl font-black tracking-tighter uppercase">Register <span class="text-innocoda-teal">Company</span></h1>
        <p class="text-gray-500 text-xs tracking-[0.2em] mt-2 font-semibold">Step 01: Establish Organization</p>
    </div>

    <div class="glass border border-white/10 p-8 rounded-2xl shadow-2xl w-full max-w-2xl">
        <form method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {% csrf_token %}
            
            <div class="md:col-span-2">
                <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2">Legal Company Name</label>
                <input type="text" name="company_name" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-innocoda-teal outline-none transition"
                    placeholder="e.g. Aylum Limited">
            </div>

            <div>
                <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2">Project Manager Name</label>
                <input type="text" name="full_name" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-innocoda-teal outline-none transition">
            </div>

            <div>
                <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2">Work Email</label>
                <input type="email" name="email" required
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-innocoda-teal outline-none transition">
            </div>

           <div class="md:col-span-2">
    <label class="block text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-2">Administrative Password</label>
    
    <!-- Wrapper added here to isolate the input and button -->
    <div class="relative">
        <input type="password" name="password" id="password" required
            class="w-full bg-white/5 border border-white/10 rounded-xl pl-4 pr-12 py-3 text-white focus:border-innocoda-teal outline-none transition"
            placeholder="Minimum 8 characters">

        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-500 hover:text-innocoda-teal focus:outline-none transition-colors duration-300">
            <!-- Eye Icon (Visible by default) -->
            <svg id="eyeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <!-- Eye Slash Icon (Hidden by default) -->
            <svg id="eyeSlashIcon" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            </svg>
        </button>
    </div>
</div>


          

            <button type="submit" 
                class="md:col-span-2 bg-innocoda-teal text-innocoda-navy font-black py-4 rounded-xl shadow-lg hover:bg-white transition-all duration-300">
                PROVISION SYSTEM ACCESS
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="{% url 'login' %}" class="text-sm text-gray-400 hover:text-white transition-colors">
                Existing account? <span class="text-innocoda-teal font-bold hover:underline">Log in here</span>
            </a>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeSlashIcon = document.getElementById('eyeSlashIcon');

        togglePassword.addEventListener('click', function () {
            // Toggle the type attribute
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Toggle the icons
            eyeIcon.classList.toggle('hidden');
            eyeSlashIcon.classList.toggle('hidden');
        });
    });
</script>

{% endblock %}
