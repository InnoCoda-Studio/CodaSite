<div style="background-color: #0f172a; padding: 40px; font-family: sans-serif; color: #ffffff; border-radius: 16px;">
    <h2 style="color: #2dd4bf; font-size: 24px;">CodaSite Security</h2>
    <p style="color: #94a3b8;">You requested a security key (password) reset for your account.</p>
    
    <div style="margin: 30px 0;">
        <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" 
           style="background-color: #2dd4bf; color: #0f172a; padding: 14px 24px; text-decoration: none; font-weight: bold; border-radius: 8px; display: inline-block;">
            RESET PASSWORD
        </a>
    </div>

    <p style="font-size: 12px; color: #64748b;">
        If you didn't request this, please ignore this email. <br>
        Link expires in 24 hours.
    </p>
    <hr style="border: 0; border-top: 1px solid #1e293b; margin: 20px 0;">
    <p style="font-size: 10px; color: #475569;">InnoCoda Studio &copy; 2026</p>
</div>
