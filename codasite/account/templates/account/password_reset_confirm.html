{% extends 'base.html' %}
{% block navbar %}{% endblock navbar %}
{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center items-center px-4">
    <div class="glass border border-white/10 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h2 class="text-white text-2xl font-semibold mb-6">Set New Security Key</h2>
        
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            {{ form.as_p }} 
            <button type="submit" 
                class="w-full bg-innocoda-teal text-innocoda-navy font-black py-4 rounded-xl shadow-lg hover:bg-white transition-all duration-300">
                UPDATE SECURITY KEY
            </button>
        </form>
    </div>
</div>

<style>
    /* Quick fix to style Django's auto-generated form fields to match your theme */
    p label { display: block; color: #9ca3af; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; margin-top: 16px; }
    p input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 0.75rem; padding: 1rem; color: white; }
    p input:focus { outline: none; border-color: #5eead4; }
    .helptext { display: block; color: #4b5563; font-size: 11px; margin-top: 4px; }

    {% comment %} gunicorn --chdir codasite codasite.wsgi:application {% endcomment %}
</style>
{% endblock %}
