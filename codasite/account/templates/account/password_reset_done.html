{% extends 'base.html' %}
{% block navbar %}{% endblock navbar %}
{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center items-center px-4">
    <div class="glass border border-white/10 p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
        <div class="w-16 h-16 bg-innocoda-teal/20 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-innocoda-teal" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
        </div>
        <h2 class="text-white text-2xl font-semibold mb-4">Check Your Inbox</h2>
        <p class="text-gray-400 text-sm leading-relaxed mb-8">
            We've dispatched a recovery link to your email. If it doesn't arrive in 5 minutes, check your spam folder.
        </p>
        <a href="{% url 'login' %}" class="text-innocoda-teal hover:underline text-sm uppercase tracking-widest font-bold">Return to Login</a>
    </div>
</div>
{% endblock %}
