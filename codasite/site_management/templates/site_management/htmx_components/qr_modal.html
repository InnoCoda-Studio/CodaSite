<div id="qr-modal" x-data="{ show: true }" x-show="show" 
     class="fixed inset-0 z-[500] flex items-center justify-center bg-black/80 backdrop-blur-md p-6">
    
    <div @click.away="show = false; setTimeout(() => $el.remove(), 300)" 
         class="glass max-w-sm w-full p-8 rounded-[3rem] border border-white/20 text-center shadow-2xl">
        
        <h3 class="text-2xl font-black text-white uppercase tracking-tighter mb-2">{{ site.name }}</h3>
        <p class="text-[10px] text-innocoda-teal font-black uppercase tracking-[0.2em] mb-6">Gate Entry Pass</p>
        
        <div class="bg-white p-4 rounded-3xl inline-block shadow-[0_0_30px_rgba(0,210,210,0.3)]">
            <img src="data:image/png;base64,{{ qr_code }}" class="w-64 h-64">
        </div>
        
        <p class="mt-6 text-gray-400 text-[10px] font-bold uppercase leading-relaxed">
            Workers should scan this to <br> <span class="text-white">Clock In / Out</span> automatically.
        </p>
        
        <button @click="show = false; setTimeout(() => $el.closest('#qr-modal').remove(), 300)" 
                class="mt-8 w-full py-4 glass border border-white/10 text-white text-xs font-black uppercase rounded-2xl hover:bg-white hover:text-black transition-all">
            Close Gate Pass
        </button>
    </div>
</div>
